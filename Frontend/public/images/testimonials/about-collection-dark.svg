<svg xmlns="http://www.w3.org/2000/svg" width="600" height="538" viewBox="0 0 600 538" role="img">
<title>Testimonial collection page with a fading gradient backdrop</title>
<defs><linearGradient id="backdrop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#282B40"/><stop offset="1" stop-color="#282B40" stop-opacity="0"/></linearGradient></defs>
<rect width="600" height="538" rx="10" fill="url(#backdrop)"/>
<g transform="translate(42 82) scale(.86)"><rect x="22" y="22" width="556" height="376" rx="18" fill="#1C2033" stroke="#343B56"/><circle cx="40" cy="40" r="3" fill="#F7A59B"/><circle cx="54" cy="40" r="3" fill="#F4CC74"/><circle cx="68" cy="40" r="3" fill="#7DE6C3"/><text x="425" y="44" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#B5BCD3">ILLUSTRATION</text><circle cx="300" cy="94" r="23" fill="#3068F5"/><text x="289" y="103" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">“</text><text x="151" y="147" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#F3F4FA">Tell us about your experience</text><text x="150" y="174" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#B5BCD3">Your story could help someone get started.</text><rect x="68" y="196" width="464" height="86" rx="12" fill="#111322" stroke="none"/><text x="86" y="221" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#F3F4FA">A few ideas to get you started</text><text x="86" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#B5BCD3">What problem did we help you solve?</text><text x="86" y="266" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#B5BCD3">What did you enjoy most?</text><rect x="68" y="304" width="224" height="44" rx="12" fill="#3068F5" stroke="none"/><text x="112" y="332" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Record a video</text><rect x="307" y="304" width="225" height="44" rx="12" fill="#1C2033" stroke="#343B56"/><text x="350" y="332" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#F3F4FA">Write a review</text><text x="190" y="375" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#B5BCD3">Your words. Your experience.</text></g>
</svg>
